name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend Lint & Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nivasops
          POSTGRES_USER: nivasops
          POSTGRES_PASSWORD: nivasops_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: backend/requirements/*.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements/dev.txt

      - name: Run Ruff linter
        run: ruff check backend --config backend/pyproject.toml

      - name: Verify Django migration drift
        env:
          DJANGO_SECRET_KEY: ci-build-secret-key-1234567890
          DATABASE_URL: postgresql://nivasops:nivasops_ci_password@127.0.0.1:5432/nivasops
          PYTHONPATH: backend
        run: python backend/manage.py makemigrations --check --dry-run

      - name: Verify Django system checks
        env:
          DJANGO_SECRET_KEY: ci-build-secret-key-1234567890
          DATABASE_URL: postgresql://nivasops:nivasops_ci_password@127.0.0.1:5432/nivasops
          PYTHONPATH: backend
        run: python backend/manage.py check

      - name: Run pytest test suite
        env:
          DJANGO_SECRET_KEY: ci-build-secret-key-1234567890
          DATABASE_URL: postgresql://nivasops:nivasops_ci_password@127.0.0.1:5432/nivasops
          TEST_PGDATABASE: test_nivasops_ci
          CELERY_TASK_ALWAYS_EAGER: "true"
          PYTHONPATH: backend
        run: pytest backend/tests/test_health.py -q

  frontend:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix frontend

      - name: Run ESLint
        run: npm run lint --prefix frontend

      - name: Run Next.js production build
        run: npm run build --prefix frontend
